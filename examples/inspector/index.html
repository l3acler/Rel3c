<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Development inspector</title>
<style>
  body{font:17px system-ui;max-width:64rem;margin:2rem auto;padding:0 1rem}
  button,select,textarea{font:inherit;padding:.5rem;margin:.4rem 0}
  button{margin-right:.5rem}label{display:block;margin:1rem 0}
  textarea{display:block;box-sizing:border-box;width:100%;font:14px ui-monospace,monospace}
  :focus-visible{outline:3px solid #1268bb;outline-offset:3px}
</style>
<h1>Development inspector</h1>
<p>Change the counter, then refresh the inspector. Select an action to see its changed properties and dirty bindings, or a render to see evaluations and DOM writes. Exports include application values and require an explicit button press.</p>
<main id="app"></main>
<aside id="inspector" aria-label="Development inspector"></aside>
<script type="module" src="./main.js"></script>
</html>
